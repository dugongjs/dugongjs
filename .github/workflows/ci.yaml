name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test (NestJS v${{ matrix.nest }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        nest: ['10', '11', '12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Pin NestJS to v${{ matrix.nest }}
        if: matrix.nest != '10'
        run: node scripts/set-nest-version.mjs ${{ matrix.nest }}

      - name: Install dependencies
        run: pnpm install ${{ matrix.nest == '10' && '--frozen-lockfile' || '--no-frozen-lockfile' }}

      - name: Report resolved NestJS version
        run: pnpm why @nestjs/common --recursive --depth 0 || true

      - name: Run tests
        run: pnpm test:run

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build
